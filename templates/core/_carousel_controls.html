{% load i18n %}
{# Controles do carrossel: o JS mostra, esconde e preenche conforme o número de páginas #}
<div class="carousel-controls" hidden>
    <div class="carousel-dots"></div>
    <span class="carousel-count"></span>
    <div class="carousel-arrows">
        <button type="button" class="carousel-arrow" data-dir="prev" aria-label="{% trans 'Anterior' %}">
            <svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M224 128a8 8 0 0 1-8 8H59.31l58.35 58.34a8 8 0 0 1-11.32 11.32l-72-72a8 8 0 0 1 0-11.32l72-72a8 8 0 0 1 11.32 11.32L59.31 120H216a8 8 0 0 1 8 8Z"/></svg>
        </button>
        <button type="button" class="carousel-arrow" data-dir="next" aria-label="{% trans 'Próximo' %}">
            <svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M221.66 133.66l-72 72a8 8 0 0 1-11.32-11.32L196.69 136H40a8 8 0 0 1 0-16h156.69l-58.35-58.34a8 8 0 0 1 11.32-11.32l72 72a8 8 0 0 1 0 11.32Z"/></svg>
        </button>
    </div>
</div>
