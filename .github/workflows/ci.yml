name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-not-a-secret
      # DEBUG=True como no desenvolvimento: sem redirect HTTPS e sem exigir o
      # manifest do collectstatic. Banco: SQLite (default do settings).
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Formatação (black + isort)
        run: |
          black --check .
          isort --check-only .

      - name: Migrações em dia
        run: python manage.py makemigrations --check --dry-run

      - name: Testes
        run: pytest --cov --cov-report=term-missing
